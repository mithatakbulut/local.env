services:
  localenv:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      LOCALENV_PUBLIC_URL: ${LOCALENV_PUBLIC_URL:?set LOCALENV_PUBLIC_URL to this instance's public HTTP(S) URL}
      LOCALENV_GITHUB_OAUTH_CLIENT_ID: ${LOCALENV_GITHUB_OAUTH_CLIENT_ID:?set LOCALENV_GITHUB_OAUTH_CLIENT_ID to the bootstrap OAuth App client ID}
      LOCALENV_GITHUB_OAUTH_CLIENT_SECRET: ${LOCALENV_GITHUB_OAUTH_CLIENT_SECRET:?set LOCALENV_GITHUB_OAUTH_CLIENT_SECRET to the bootstrap OAuth App client secret}
      LOCALENV_GITHUB_APP_CREDENTIALS_ENCRYPTION_KEY: ${LOCALENV_GITHUB_APP_CREDENTIALS_ENCRYPTION_KEY:?set LOCALENV_GITHUB_APP_CREDENTIALS_ENCRYPTION_KEY to a random base64 32-byte key}
    volumes:
      - localenv-data:/data
    restart: unless-stopped

volumes:
  localenv-data:
