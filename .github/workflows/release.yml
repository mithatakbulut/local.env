name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: go vet ./...
      - run: go test ./...
      - name: Build release archives
        run: |
          set -eu
          mkdir -p dist/build
          for target in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64"; do
            set -- ${target}
            goos="$1"
            goarch="$2"
            build_dir="dist/build/${goos}_${goarch}"
            mkdir -p "${build_dir}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "${build_dir}/localenv" ./cmd/localenv
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "${build_dir}/localenv-server" ./cmd/localenv-server
            tar -C "${build_dir}" -czf "dist/localenv_${GITHUB_REF_NAME}_${goos}_${goarch}.tar.gz" localenv localenv-server
          done
          rm -rf dist/build
          (cd dist && sha256sum localenv_"${GITHUB_REF_NAME}"_*.tar.gz > checksums.txt)
      - uses: anchore/sbom-action@v0
        with:
          artifact-name: sbom.spdx.json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@v3.9.2
      - name: Sign release artifacts with GitHub OIDC
        run: |
          cosign sign-blob --yes --bundle dist/checksums.txt.bundle dist/checksums.txt
          cosign sign-blob --yes --bundle dist/sbom.spdx.json.bundle dist/sbom.spdx.json
      - name: Build container and record immutable digest
        run: |
          docker build --file deploy/docker/Dockerfile --tag localenv:${GITHUB_REF_NAME} .
          docker image inspect --format='{{index .RepoDigests 0}}' localenv:${GITHUB_REF_NAME} > dist/container-image-digest.txt || docker image inspect --format='{{.Id}}' localenv:${GITHUB_REF_NAME} > dist/container-image-digest.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/*.bundle
            dist/sbom.spdx.json
            dist/container-image-digest.txt
