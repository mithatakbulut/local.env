name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/localenv ./cmd/localenv-server
      - run: docker build --file deploy/docker/Dockerfile --tag localenv:test .
