name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked local secret files
        run: |
          set -eu
          tracked="$(git ls-files | grep -E '(^|/)\.env($|\.)|(^|/)\.envrc$|\.(pem|key|p12|pfx)$' || true)"
          unsafe="$(printf '%s\n' "${tracked}" | grep -Ev '(^|/)\.env(\.[^/]+)*\.example$' || true)"
          if [ -n "${unsafe}" ]; then
            printf 'Tracked local secret-shaped files are not allowed:\n%s\n' "${unsafe}" >&2
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "26.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: git diff --check
      - run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/localenv ./cmd/localenv-server
      - name: Verify release targets cross-compile
        run: |
          set -eu
          for target in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64"; do
            set -- ${target}
            CGO_ENABLED=0 GOOS="$1" GOARCH="$2" go build -o "/tmp/localenv-$1-$2" ./cmd/localenv
            CGO_ENABLED=0 GOOS="$1" GOARCH="$2" go build -o "/tmp/localenv-server-$1-$2" ./cmd/localenv-server
          done
      - run: docker build --file deploy/docker/Dockerfile --tag localenv:test .
      - uses: golang/govulncheck-action@v1
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: localenv:test
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npx playwright install --with-deps chromium
        working-directory: website
      - run: npm run verify
        working-directory: website
